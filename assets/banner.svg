<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Glowing accents -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="350" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="350" rx="16" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Dynamic / Animated Background Components (Behind Text) -->
  <g opacity="0.6">
    <!-- Pulsing Orbs in Background -->
    <circle cx="150" cy="80" r="100" fill="#38bdf8" opacity="0.15" filter="url(#glow)">
      <animate attributeName="r" values="80;110;80" dur="6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.1;0.2;0.1" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="1050" cy="270" r="120" fill="#c084fc" opacity="0.15" filter="url(#glow)">
      <animate attributeName="r" values="100;130;100" dur="8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.1;0.25;0.1" dur="8s" repeatCount="indefinite" />
    </circle>

    <!-- Animated Protocol Data Streams (Moving Dash Arrays) -->
    <!-- Connection Line 1 -->
    <path d="M 100 280 C 300 280, 400 310, 600 310 S 900 270, 1100 280" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 8" opacity="0.4">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="2s" repeatCount="indefinite" />
    </path>
    <!-- Connection Line 2 -->
    <path d="M 80 50 C 350 20, 550 50, 800 30 S 1000 60, 1120 40" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="10 10" opacity="0.3">
      <animate attributeName="stroke-dashoffset" from="0" to="40" dur="3s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Dynamic Protocol Badges / Pills (Layered safely around text) -->
  <g opacity="0.85">
    <!-- SFTP Pill -->
    <rect x="180" y="42" width="110" height="34" rx="17" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#softGlow)"/>
    <text x="235" y="64" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle">🔒 SFTP</text>

    <!-- FTPS Pill -->
    <rect x="310" y="42" width="110" height="34" rx="17" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.5"/>
    <text x="365" y="64" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle">🛡️ FTPS</text>

    <!-- FTP Pill -->
    <rect x="780" y="42" width="100" height="34" rx="17" fill="url(#cardGrad)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="830" y="64" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle">📁 FTP</text>

    <!-- AS2 / EDI Pill -->
    <rect x="900" y="42" width="120" height="34" rx="17" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.5" filter="url(#softGlow)"/>
    <text x="960" y="64" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle">📦 AS2 / EDI</text>
  </g>

  <!-- Foreground Title and Subtitle (Guaranteed Crisp & Unobscured) -->
  <g text-anchor="middle">
    <!-- Main Title Glow Shadow -->
    <text x="600" y="162" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="900" letter-spacing="-0.5" opacity="0.3" filter="url(#glow)">
      Awesome Fully Managed File Transfer
    </text>

    <!-- Main Title -->
    <text x="600" y="160" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="900" letter-spacing="-0.5">
      Awesome Fully Managed File Transfer
    </text>

    <!-- Subtitle / Protocols Ribbon -->
    <text x="600" y="212" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1">
      SFTP  •  FTPS  •  FTP  •  AS2 / EDI
    </text>

    <!-- Description Line -->
    <text x="600" y="252" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="0.3">
      Curated Enterprise MFT SaaS Platforms & Open-Source Secure File Transfer Ecosystem
    </text>
  </g>

  <!-- Bottom Interactive Status Bar -->
  <g transform="translate(350, 282)">
    <rect x="0" y="0" width="500" height="36" rx="18" fill="url(#cardGrad)" stroke="#475569" stroke-width="1"/>
    <circle cx="25" cy="18" r="5" fill="#4ade80">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="40" y="23" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
      Enterprise Compliance: HIPAA • PCI DSS • SOC 2 • ISO 27001
    </text>
  </g>
</svg>
